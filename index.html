<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d3270" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="INNOVIO" />
  <meta name="description" content="INNOVIO — Sistema de Gestión Industrial y Facturación Electrónica para Costa Rica" />
  <title>INNOVIO — Sistema de Facturación v2.0</title>
  <link rel="icon" type="image/png" href="/icon-512.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/app.css" />
  <link rel="stylesheet" href="./src/styles/comprobante.css" />
  <link rel="stylesheet" href="./src/styles/impuestos.css" />
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div class="boot-loader" aria-label="Cargando">
      <div class="boot-spinner"></div>
      <div class="boot-text">INNOVIO</div>
    </div>
  </div>
  <div id="toast-container" aria-live="polite"></div>
  <script type="module" src="./src/main.js?v=7"></script>
  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }
  </script>
  <script>
    (function(){
      setTimeout(function(){
        try {
          var body = document.body;
          if (body && body.getAttribute('data-app-mounted') === '1') return;
          var root = document.getElementById('app');
          if (!root) return;
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#071f50;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;text-align:center;padding:24px;">'
            + '<div><div style="font-size:18px;font-weight:700;margin-bottom:8px;">No se pudo iniciar la aplicación</div>'
            + '<div style="opacity:.7;margin-bottom:16px;">Revisa tu conexión y vuelve a intentarlo.</div>'
            + '<button onclick="location.reload()" style="padding:10px 20px;border:0;border-radius:8px;background:#00c2a8;color:#071f50;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;">Reintentar</button></div></div>';
        } catch(e) {}
      }, 12000);
    })();
  </script>
</body>
</html>
